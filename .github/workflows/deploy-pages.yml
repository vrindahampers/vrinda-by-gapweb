name: Deploy to GitHub Pages

# Publishes the static site to https://<user>.github.io/<repo>/ every time main
# changes. The site is fully relative (no absolute paths), so no build step and no
# base-path rewriting is needed.
#
# ⚠️ SECRET GUARD: js/famgateway.js must NOT contain a live merchant key when this
# workflow runs. A public GitHub repo is world-readable, and that key can create
# and query real FamGateway orders on the owner's account. Move it to Secret
# Manager (see GITHUB_HOSTING.md) and fill the proxy URLs instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The merchant key must never be committed: on the free (Spark) plan there
      # are no Cloud Functions, so the key is injected at deploy time from an
      # Actions secret into the PUBLISHED COPY only. The repository (and its
      # history) therefore stays key-free.
      - name: Stage the site and inject the merchant key
        env:
          FAMGATEWAY_API_KEY: ${{ secrets.FAMGATEWAY_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FAMGATEWAY_API_KEY:-}" ]; then
            echo "::error::Repository secret FAMGATEWAY_API_KEY is not set."
            echo "Add it once: GitHub -> Settings -> Secrets and variables ->"
            echo "Actions -> New repository secret -> FAMGATEWAY_API_KEY"
            echo "(value: your FamGateway merchant key, e.g. fam_ea93a7...)."
            exit 1
          fi

          if grep -qE "apiKey: *'fam_[a-z0-9]+'" js/famgateway.js; then
            echo "::error::js/famgateway.js in the repository contains a live key."
            echo "Commit it as apiKey: '' and keep the real value in the secret."
            exit 1
          fi

          # Build a clean staging copy so the working tree is never modified.
          rm -rf .pages
          mkdir -p .pages
          rsync -a --exclude '.git' --exclude '.pages' --exclude 'functions' \
                --exclude 'node_modules' --exclude '.github' ./ .pages/

          KEY="${FAMGATEWAY_API_KEY//\'/}"
          sed -i "s|apiKey: ''|apiKey: '${KEY}'|" .pages/js/famgateway.js

          if ! grep -q "apiKey: 'fam_" .pages/js/famgateway.js; then
            echo "::error::Injection failed - check that js/famgateway.js has apiKey: ''"
            exit 1
          fi
          echo "Merchant key injected into the staged copy (repository stays clean)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The staged copy already excludes functions/, .github/ and dotfiles.
          path: .pages
          exclude: |
            .pages/functions/**
            .pages/.github/**
            .pages/node_modules/**
            .pages/*.log
            .pages/README.md
            .pages/FIREBASE_SETUP.md
            .pages/FAMGATEWAY_SETUP.md
            .pages/ROUTING_AND_SEO.md
            .pages/GITHUB_HOSTING.md
            .pages/NEWSLETTER.md
            .pages/database.rules.json
            .pages/firebase.json
            .pages/.firebaserc
      - id: deployment
        uses: actions/deploy-pages@v4
