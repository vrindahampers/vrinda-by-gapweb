<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register — vrindahampers</title>
  <meta name="description" content="Sign in or register with vrindahampers to save bespoke hampers, manage wishlist, and track your personalized orders.">
  <meta name="theme-color" content="#c95d73">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    .auth-tab {
      flex: 1;
      padding: 0.85rem;
      text-align: center;
      font-weight: 600;
      font-size: var(--font-size-sm);
      border-bottom: 2px solid transparent;
      color: var(--color-text-muted);
      cursor: pointer;
      background: none;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
    .auth-pane { display: none; }
    .auth-pane.active { display: block; animation: fadeIn var(--transition-normal) ease; }
    .oauth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0.8rem 1rem;
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-md);
      background: var(--color-bg-surface);
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-main);
      cursor: pointer;
    }
    .oauth-btn:hover { background: var(--color-bg-subtle); border-color: var(--color-border-strong); }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--color-text-light);
      font-size: var(--font-size-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border-light);
    }
    .divider-text::before { margin-right: 12px; }
    .divider-text::after { margin-left: 12px; }
  </style>
</head>
<body>
  <div id="vrinda-header"></div>
  <main class="section" style="min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding-block: 3rem;">
    <div class="container" style="max-width: 480px;">
      <div class="glass-card" style="padding: clamp(1.5rem, 4vw, 2.5rem); border-radius: var(--radius-xl);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <span class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 4px;">vrinda<span>hampers</span></span>
          <p style="font-size: var(--font-size-sm); color: var(--color-text-muted);">Welcome to our personalized gifting world</p>
        </div>

        <div id="authNotice" style="display: none; padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: var(--font-size-xs); line-height: 1.4;"></div>

        <button class="oauth-btn" id="googleAuthBtn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="divider-text">or with email</div>

        <div style="display: flex; border-bottom: 1px solid var(--color-border-light); margin-bottom: 1.5rem;">
          <button class="auth-tab active" data-target="loginPane">Sign In</button>
          <button class="auth-tab" data-target="registerPane">New Account</button>
        </div>

        <div class="auth-pane active" id="loginPane">
          <form id="loginForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label class="form-label" for="loginPassword">Password</label>
                <a href="javascript:void(0)" id="showForgotBtn" style="font-size: var(--font-size-xs); color: var(--color-primary);">Forgot?</a>
              </div>
              <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-xs);" id="loginSubmitBtn">
              Sign In
            </button>
          </form>
        </div>
        <div class="auth-pane" id="registerPane">
          <form id="registerForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="registerName">Full Name</label>
              <input type="text" id="registerName" class="form-input" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="registerEmail">Email Address</label>
              <input type="email" id="registerEmail" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="registerPhone">Phone / WhatsApp</label>
              <input type="tel" id="registerPhone" class="form-input" placeholder="+91 98765 43210" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="registerPassword">Password</label>
              <input type="password" id="registerPassword" class="form-input" placeholder="Min 6 characters" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-xs);" id="registerSubmitBtn">
              Create Account
            </button>
          </form>
        </div>

        <div class="auth-pane" id="forgotPane">
          <h3 style="font-size: 1.25rem; margin-bottom: 8px;">Reset Password</h3>
          <p style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-bottom: 1.25rem;">
            Enter your email to receive a password reset link.
          </p>
          <form id="forgotForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="forgotEmail">Email Address</label>
              <input type="email" id="forgotEmail" class="form-input" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 8px;">Send Reset Link</button>
            <button type="button" class="btn btn-secondary btn-sm" id="cancelForgotBtn" style="width: 100%;">Back to Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="vrinda-footer"></div>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Project Scripts -->
  <script src="../assets/data/sample-data.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/login-controller.js"></script>
</body>
</html>
